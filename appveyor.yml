os: Visual Studio 2022
version: 1.0.{build}
skip_tags: true
configuration: Release
assembly_info:
  patch: true
  file: '**\AssemblyInfo.*'
  assembly_version: '{version}'
  assembly_file_version: '{version}'
  assembly_informational_version: '{version}'
environment:
  COVERALLS_REPO_TOKEN:
    secure: 1Cn22xLzXzP6P3dTXXJX0G3bcsluYI9GG
matrix:
  allow_failures:
    - CLI_VERSION: Latest
before_build:
  - nuget restore ".\eSusInsurers.sln"
build_script:
  - dotnet build -c Release
test_script:
  - dotnet tool install --global coveralls.net
  - dotnet tool install coveralls.net
  - dotnet tool restore
  - dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
  - csmacnz.Coveralls --opencover -i /Tests/eSusInsurers.Tests/coverage.opencover.xml --useRelativePaths

